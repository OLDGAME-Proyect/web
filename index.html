<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | NZXY</title>
  
  <meta http-equiv="refresh" content="3;url=https://oldgamesproyect.site/">
  <link rel="canonical" href="https://oldgamesproyect.site/">

  <style>
    :root {
      --bg-color: #060709;
      --panel-bg: rgba(13, 17, 23, 0.445);
      --panel-border: rgba(255, 191, 72, 0.15);
      --accent-orange: #ff9900;
      --text-light: #f0f6fc;
      --text-muted: #8b949e;
      --font-sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --transition-fast: 0.18s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-light);
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.88) 100%),
        url('back.webp');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .redirect-card {
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .redirect-card:hover {
      border-color: #ffbb00;
      box-shadow: 
        0 0 8px #ff9900,
        0 0 7px rgba(255, 153, 0, 0.9),
        0 0 12px rgba(255, 102, 0, 0.75);
    }

    .logo-img {
      max-width: 160px;
      height: auto;
      object-fit: contain;
      transition: transform var(--transition-fast);
    }

    .redirect-card:hover .logo-img {
      transform: scale(1.05);
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 166, 0, 0.85);
      padding: 0.4rem 0.9rem;
      border: 1.5px solid var(--panel-border);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all var(--transition-fast);
    }

    .redirect-card:hover .status-badge {
      color: var(--accent-orange);
      text-shadow: 
        0 0 8px #ff9900,
        0 0 18px rgba(255, 153, 0, 0.9);
      box-shadow: 
        0 0 8px #ff9900,
        0 0 7px rgba(255, 153, 0, 0.9);
      border-color: currentColor;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-orange);
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    a {
      font-family: var(--font-mono);
      color: var(--text-light);
      text-decoration: none;
      font-weight: 700;
      transition: all var(--transition-fast);
    }

    a:hover {
      color: var(--accent-orange);
      text-shadow: 
        0 0 8px #ff9900,
        0 0 18px rgba(255, 153, 0, 0.9);
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--accent-orange);
      width: 0%;
      box-shadow: 0 0 8px var(--accent-orange);
      animation: fill 3s linear forwards;
    }

    @keyframes fill {
      to { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <img src="logo.webp" alt="NZXY Logo" class="logo-img">

    <div class="status-badge">
      <span class="dot"></span>
      301 REDIRECT
    </div>

    <div>
      <h1>Redirecting to OldGame Project</h1>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <p>
      If you are not redirected automatically within a few seconds, click 
      <a id="redirect-link" href="https://oldgamesproyect.site/">here</a>.
    </p>
  </div>

  <script>
    const TARGET_URL = "https://oldgamesproyect.site/";

    setTimeout(() => {
      window.location.replace(TARGET_URL);
    }, 3000);
  </script>

</body>
</html>
